spring.application.name=msa

# Puerto del microservicio
server.port=8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

# Conexión con Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Database Configurationn

# H2 (in-memory) datasource
spring.datasource.url=jdbc:h2:mem:msadb;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.platform=h2



#MYSQL datasource
#spring.datasource.url=jdbc:mysql://10.13.29.9:3306/msadb
#spring.datasource.username=idgs
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.password=idgs
#spring.sql.init.platform=mysql

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# data.sql debe correr después de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

# H2 console (web) enabled
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console