spring.application.name=serviciosocial
server.port=8085

# Seguridad JWT (OAuth2 Resource Server)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

# Conexión con Eureka Discovery Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Base de datos H2 (en memoria)
spring.datasource.url=jdbc:h2:mem:serviciosocialDB;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.platform=h2

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# URL directa de fallback para Feign (Alumnos)
alumnos.url=http://localhost:8083
