spring.application.name=apigateway
server.port=8080

# Eureka: servidor aparte (proyecto eurekaserver, puerto 8761)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Rutas originales respetadas estrictamente
spring.cloud.gateway.server.webmvc.routes[0].id=msa
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://msa
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/entity-a,/api/entity-a/**

spring.cloud.gateway.server.webmvc.routes[1].id=microb
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://microb
